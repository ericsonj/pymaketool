[project]
name = "pymaketool"
version = "3.0.0-rc.4"
description = ""
authors = [{ name = "Ericson Joseph", email = "ericsonjoseph@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["setuptools (>=80.10.2,<81.0.0)", "prompt-toolkit (>=3.0.52,<4.0.0)", "tomli (>=2.4.0,<3.0.0)", "copier (>=9.0.0,<10.0.0)", "jinja2-time (>=0.2.0,<0.3.0)"]

[tool.poetry]
packages = [
    { include = "pm", from = "src" },
    { include = "pymaketool3", from = "src" },
    { include = "pymakelib", from = "src" },
    { include = "pynewproject", from = "src" },
    { include = "pymaketesting", from = "src" },
    { include = "pymakedot", from = "src" },
    { include = "pybuildanalyzer", from = "src" },
    { include = "pybuildanalyzer2", from = "src" },
    { include = "pymaketool", from = "src" },
    { include = "pymakemigrate", from = "src" },
]

[tool.poetry.scripts]
pynewproject = "pynewproject.__main__:main"
pymaketool = "pymaketool.__main__:main"
pymaketesting = "pymaketesting.__main__:main"
pymakedot = "pymakedot.__main__:main"
pybuildanalyzer = "pybuildanalyzer.__main__:main"
pybuildanalyzer2 = "pybuildanalyzer2.__main__:main"
pymakemigrate = "pymakemigrate.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest (>=9.0.2,<10.0.0)", "pytest-cov (>=7.0.0,<8.0.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
